name: Publish verified PocketFoldLive v76 once
on:
  push:
    paths:
      - ".github/workflows/publish-v76-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'Lovely573/PocketFoldLive-Updates'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prevent duplicate publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v76 --repo Lovely573/PocketFoldLive-Updates >/dev/null 2>&1; then
            echo "Release v76 already exists: refusing duplicate"
            exit 1
          fi
      - name: Fetch exact Fold8-tested signed build 76 and verify checksums
        env:
          SOURCE_ARCHIVE_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-60fc-8230-a1fe-3056921e2bee/raw?se=2026-10-13T04%3A55%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=f46f4cd3-d6b1-5850-8a4c-de763bbf9959&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T00%3A24%3A05Z&ske=2026-10-14T00%3A24%3A05Z&sks=b&skv=2026-02-06&sig=nRwhOpo5XGZWJA0TwHkGjYW9sdRwYINnniKUaSpICP8%3D"
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 180 "$SOURCE_ARCHIVE_URL" -o artifact.zip
          echo "fa7c7714e6f341d3afab0e150c243900fee145a820e8110453d46f178e87dd7e  artifact.zip" | sha256sum -c -
          unzip -p artifact.zip PocketFoldLive-B76-test.apk > PocketFoldLive.apk
          echo "90e5986c8f8b6a44f8d7d23f63d056d0125268ef34f21f883563eb5b7f7bba5b  PocketFoldLive.apk" | sha256sum -c -
          test "$(stat -c '%s' PocketFoldLive.apk)" -eq 14717403
      - name: Publish verified build 76 for in-app updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v76 PocketFoldLive.apk \
            --repo Lovely573/PocketFoldLive-Updates \
            --title "PocketFoldLive 빌드 76 · Fold8 실기기 재생 확인" \
            --notes "Galaxy Fold8 접힘·펼침·충전 시작 상황에서 사용자 실기기 재생을 확인한 빌드 76입니다. 실기기에서 검증된 서명 APK를 그대로 정식 최신 업데이트로 등록했습니다(앱 내부 표시 버전: 0.30.5-test, 빌드 76). 실제 라이브 배경화면에서 Canvas 안내 화면이 동영상 디코더와 동일한 Surface를 점유하던 경로를 제거했습니다. 영상 재시도 중에도 Canvas에 다시 그리지 않으며 재생기 종료 및 진단 로그도 개선했습니다. 기존 영상, 즐겨찾기, 상황별 설정을 유지하며 앱을 삭제하지 않고 업데이트할 수 있습니다." \
            --latest
