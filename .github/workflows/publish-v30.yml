name: Publish PocketFoldLive v30 APK
on:
  push:
    paths:
      - '.github/workflows/publish-v30.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve private-key signed v30 APK
        env:
          ARTIFACT_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-4868-820b-93ed-3d560dfdc9ce/raw?se=2026-10-11T06%3A47%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=0b4a7b1b-74a3-53e8-a500-e11692a46e6c&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T06%3A42%3A52Z&ske=2026-10-12T06%3A42%3A52Z&sks=b&skv=2026-02-06&sig=NF19%2BCpiY1DRzZtus7yz5yyMD7ujZHLlCGUNvvnKwXQ%3D'
        run: |
          set -euo pipefail
          curl --retry 3 --fail --location "$ARTIFACT_URL" --output artifact.zip
          unzip -o artifact.zip PocketFoldLive.apk
          test -s PocketFoldLive.apk
      - name: Publish public APK-only release v30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v30 PocketFoldLive.apk --repo "${{ github.repository }}" --title "PocketFoldLive v0.14.0 (30)" --notes "New character video browser: search official Shin-chan, Doraemon, Pokemon/Pikachu, SpongeBob, Jadoo, Detective Conan videos; discover free animated video sources; preview user-selected videos inside the app and apply to independent scene and portrait/unfolded/landscape slots. This build uses the same private signing key as v29, so v29 users can install as an update without uninstalling. Copyrighted media is not bundled and is not scraped from video sites. Device verification is still recommended." --latest
