name: Publish PocketFoldLive v34 APK
on:
  push:
    paths:
      - '.github/workflows/publish-v34.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve signed v34 APK from verified main CI
        env:
          ARTIFACT_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-2b9c-820b-8dbc-9ff3a8087399/raw?se=2026-10-11T08%3A57%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=cf526b5e-2482-5ea8-9b76-e88646800099&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T07%3A39%3A46Z&ske=2026-10-12T07%3A39%3A46Z&sks=b&skv=2026-02-06&sig=QcDQTZ04lELfBRNBk58tnQC8sNewPji9fv3em3GlLBE%3D'
        run: |
          set -euo pipefail
          curl --retry 3 --fail --location "$ARTIFACT_URL" --output artifact.zip
          unzip -o artifact.zip PocketFoldLive.apk
          test -s PocketFoldLive.apk
      - name: Publish public APK-only release v34
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v34 PocketFoldLive.apk --repo "${{ github.repository }}" --title "PocketFoldLive v0.16.0 (34)" --notes "Modern Dark redesign: navy and blue/lavender styling, Home / Gallery / Settings tabs, redesigned per-scene wallpaper cards with two-column unfolded Fold layout, quick wallpaper preview/apply on Home, grouped advanced settings and app update section, and an original adaptive fold-and-play app icon replacing Android's default gallery icon. All existing media settings, automatic wallpaper transitions, and the remote GitHub wallpaper gallery are preserved. APK was signed with the existing private release key for in-place update over v33 and prior. Android CI build/tests/signing passed; test on a physical Fold8 remains recommended." --latest
