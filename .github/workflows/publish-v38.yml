name: Publish PocketFoldLive v38 APK
on:
  push:
    paths:
      - '.github/workflows/publish-v38.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch signed v38 APK built by original private workflow
        env:
          ARTIFACT_URL: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-fb2c-81f7-a2db-b13022cfeeb8/raw?se=2026-10-11T10%3A30%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=3a20559e-bc7f-54d0-ac0e-d43b507d4f72&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T05%3A15%3A17Z&ske=2026-10-12T05%3A15%3A17Z&sks=b&skv=2026-02-06&sig=InoQ22HbuwfxFIeLV/XCYv5QpQIhjsWq5z7oemOwx3U%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output verified.zip
          unzip -o verified.zip PocketFoldLive.apk
          test -s PocketFoldLive.apk
          echo '59ca2b68e6c14fd70c969a64cdcba8e2ce90a6c696f4881e2c0a90dba590f20c  PocketFoldLive.apk' | sha256sum --check -
      - name: Publish v38 as latest for the existing in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v38 PocketFoldLive.apk --repo "${{ github.repository }}" \
            --title "PocketFoldLive v0.17.3 (38)" \
            --notes "Fix fold-state video selection based on per-wallpaper display context (cover and unfolded screen). Preserve unfolded screen priority over landscape virtual surface. Correct scene-video fallback ordering and charging/night precedence. Add a one-tap scenario preset: fill only empty settings or replace all after explicit confirmation. Automatically select creator-shared originals for 10 scenarios x portrait/unfolded/landscape display slots, de-duplicate original video downloads, validate MP4 content and orientation, and preserve prior settings for missing media. Prevent deleting shared preset video from other configured scenarios. Signed v38 built from 3fd283206b1b49c0585d12fb7bd8c9fc1b90e31f and verified SHA-256 59ca2b68e6c14fd70c969a64cdcba8e2ce90a6c696f4881e2c0a90dba590f20c. GitHub unit tests, release build, and signed APK verification passed; Samsung Fold8 screen-specific live wallpaper application requires on-device smoke testing." \
            --latest
