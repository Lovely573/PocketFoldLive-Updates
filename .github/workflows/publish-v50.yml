name: Publish PocketFoldLive v50 APK
on:
  push:
    paths:
      - '.github/workflows/publish-v50.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch signed v50 APK and verify digest
        env:
          ARTIFACT_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-7878-820b-ac2f-a20df75365cc/raw?se=2026-10-12T02%3A41%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=058962e0-8871-502c-a154-1570bd63cd31&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T01%3A33%3A39Z&ske=2026-10-13T01%3A33%3A39Z&sks=b&skv=2026-02-06&sig=OARR9TzLo6tuTwyF%2BOht%2BJjaOryd5%2Bl0FMVjuKUEx%2BA%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output signed.zip
          unzip -o signed.zip PocketFoldLive.apk
          test -s PocketFoldLive.apk
          echo '5afac14d3f8f18bb5263603912b0d473dd74773bddac28ea55298466f9af19b3  PocketFoldLive.apk' | sha256sum --check -
      - name: Release v50 for in-app update dialog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v50 PocketFoldLive.apk --repo "${{ github.repository }}" \
            --title "PocketFoldLive v0.20.1 (50)" \
            --notes "v50 / 0.20.1 recommendation diversity and charging catalog update. Remote catalog-v9 expands from 95 to 124 video variants with portrait/landscape counterparts and additional Pokemon/Sanrio works linked to original publisher downloads; no video files are mirrored in the catalog repository. Circuit-board clips are disabled from default recommendations, and the old electric charging preference transparently migrates to a light/natural-energy preference. Strict scene/orientation recommendations now cycle every compatible candidate exactly once before starting a new cycle, avoid the immediately previous clip/artwork at the next cycle start when alternatives exist, treat portrait/landscape versions as one artwork, reduce consecutive same-character groups for near-equal scores, and show candidate counts. After removing circuit defaults the catalog has, per orientation: 9 charging-start, 7 charging, 11 full-battery, 14 low-battery, 10 critical-battery and 23 night candidates. Existing wallpaper assignments and stored app settings remain intact. Source commit d22e4f8e8d7a1818771b51586fa0d982f4bc3642; catalog commit 36bd9f6dc40add57200f41123fde5c64897f82cc. Signed APK SHA256 5afac14d3f8f18bb5263603912b0d473dd74773bddac28ea55298466f9af19b3. Signer certificate SHA256 6ae796f34679053575a93b19e5809a36e087334651efbba9413b1bb181487ba7 matches v49. GitHub Actions unit tests, release build, private signing verification and signed artifact upload all passed. Actual Fold8 wallpaper behavior still requires device-side verification." \
            --latest
