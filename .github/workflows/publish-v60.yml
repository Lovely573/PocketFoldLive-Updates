name: Publish PocketFoldLive v60 signed APK
on:
  push:
    paths:
      - '.github/workflows/publish-v60.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify signed APK
        env:
          ARTIFACT_URL: 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-45f4-81fa-9d7b-0de4e598c48e/raw?se=2026-10-12T06%3A42%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=5527460e-a825-57c6-8e6f-45a2c63b273b&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T01%3A33%3A42Z&ske=2026-10-13T01%3A33%3A42Z&sks=b&skv=2026-02-06&sig=JxXzWGY4rS2L3IDJOtAw%2Blaps8uknrWsS%2B2pUPkavDA%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output signed.zip
          unzip -o signed.zip PocketFoldLive.apk
          test -s PocketFoldLive.apk
          echo 'ba67bc49439beac2490d0e2bc2b4e8e196ec7c1f0885fcc2540644df3faabd3a  PocketFoldLive.apk' | sha256sum --check -
      - name: Publish v60 with Korean release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'NOTES'
          ## PocketFoldLive 0.23.2 · 빌드 60

          - 갤러리의 ‘내 영상’ 버튼을 실제 내 영상/사진 파일 선택 기능에 연결했습니다.
          - 새로 적용한 추천 영상은 제목을 보존하고, 이전 버전의 자동 추천 영상도 가능한 경우 오프라인 제목 목록에서 복원해 표시합니다.
          - 접힌 화면·펼친 화면의 등록 개수를 실제 사용 가능한 상황 수(접힘 7, 펼침 8)로 표시합니다.
          - 전체 영상 탐색에서 ‘현재 화면 비율에 맞는 영상만 표시’ 필터를 기본 제공하고 필요하면 해제할 수 있습니다.
          - 상황별 영상 현황에서 썸네일 캐시를 적용하고 앱이 뒤로 가면 미리보기 재생을 일시정지합니다.
          - AI 영상 찾기의 캐릭터 선택에 명탐정 코난·안녕 자두야·도라에몽을 추가했습니다.

          중요: 명탐정 코난과 안녕 자두야는 이번 버전에 ‘AI 영상 찾기’ 검색 대상으로 추가됐습니다. 실제 다운로드 가능한 검증된 MP4는 아직 온라인 추천 영상 목록에 등록하지 않았습니다. 원본 출처·다운로드 권한·재생 여부를 검증한 영상만 후속 추가합니다.
          기존 배경화면 적용 및 좋아요·싫어요 기록은 유지합니다.
          소스 커밋: 0dfc3e4a93325028cc6d85c41b39c8c08ded4fa0
          APK SHA256: ba67bc49439beac2490d0e2bc2b4e8e196ec7c1f0885fcc2540644df3faabd3a
          NOTES
          gh release create v60 PocketFoldLive.apk --repo "${{ github.repository }}" --title "PocketFoldLive v0.23.2 (60)" --notes-file RELEASE_NOTES.md --latest
