name: Publish PocketFoldLive v40 APK
on:
  push:
    paths:
      - '.github/workflows/publish-v40.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download privately signed v40 build and verify SHA256
        env:
          ARTIFACT_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-9108-820b-9332-db146f827912/raw?se=2026-10-11T12%3A29%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=7df444c8-2c2d-5532-b525-9eeffc52e463&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T09%3A05%3A56Z&ske=2026-10-12T09%3A05%3A56Z&sks=b&skv=2026-02-06&sig=B1OYdIErAUKuz1I5IwHSpsUgX0Rh%2BGZT2XPhLbLaEqA%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output signed.zip
          unzip -o signed.zip PocketFoldLive.apk
          test -s PocketFoldLive.apk
          echo 'f8208072d900c71ea6f4c2a640f67394f7eb7262d7828a20d480c13b5f7e4655  PocketFoldLive.apk' | sha256sum --check -
      - name: Publish current signed v40 APK for in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v40 PocketFoldLive.apk --repo "${{ github.repository }}" \
            --title "PocketFoldLive v0.18.0 (40)" \
            --notes "Simplified per-situation wallpaper customization. Replace the confusing two-column grid of repeated controls with one focused editor: select folded/unfolded/landscape display, choose situation, inspect assigned/fallback status, choose an original shared video or local file, preview the moving media and apply only to that chosen display/scene. The video explorer now labels selection steps before preview and provides clear apply confirmation and return to gallery. Auto preset, 32 curated original links and Android cover-screen system setup are preserved. Existing settings remain intact. Source commit c804dc4035f19446fbe5e2e285853eb56841159a. Signed APK SHA256 f8208072d900c71ea6f4c2a640f67394f7eb7262d7828a20d480c13b5f7e4655. CI unit tests, release build and signature verification passed. Real physical Fold8 interaction needs smoke testing." \
            --latest
