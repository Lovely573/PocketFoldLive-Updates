name: Publish PocketFoldLive v41 APK
on:
  push:
    paths:
      - '.github/workflows/publish-v41.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed v41 build and verify SHA256
        env:
          ARTIFACT_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-2894-8230-a827-fbd0a7bea86d/raw?se=2026-10-11T12%3A45%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=ab22e99d-e26c-542f-99db-56794cab8d42&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T11%3A50%3A40Z&ske=2026-10-12T11%3A50%3A40Z&sks=b&skv=2026-02-06&sig=2/8H4lsbnip2RdZo4xi8ROWWZCiYVnPDcsA0E0leHFw%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output signed.zip
          unzip -o signed.zip PocketFoldLive.apk
          test -s PocketFoldLive.apk
          echo '3c9e05d370fb882320117f035cf00ab83cacc3e2b9def4dd82f9e0d0b50b27a9  PocketFoldLive.apk' | sha256sum --check -
      - name: Publish signed v41 APK for existing in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v41 PocketFoldLive.apk --repo "${{ github.repository }}" \
            --title "PocketFoldLive v0.18.1 (41)" \
            --notes "Recommendation browser and customizable presets. The in-app gallery now shows four curated scenario-compatible video choices at a time, with repeated Next recommendations and full-list mode. In auto setup, view 10 scenarios per selected display (folded/inner/landscape), click Next for alternative original videos for each scenario, shuffle the entire recommendation combination, preview any selected original in the video explorer, apply individually, or confirm the final 30-slot plan all at once. Unavailable original files never replace a prior slot. Creator-linked remote catalog was expanded from 32 to 49 MP4s, including new Pokemon (Bulbasaur/Arceus/Kyogre), Totoro, Doraemon, Snoopy, Sanrio/Kuromi/Cinnamoroll/Hello Kitty, and calming animals. No videos mirrored in GitHub. Source commit 3375cbf27308a47d605f576f6f2c1a5b5dcd967e; signed APK SHA256 3c9e05d370fb882320117f035cf00ab83cacc3e2b9def4dd82f9e0d0b50b27a9. Tests, Android build and signing passed. Actual Galaxy Fold8 device behavior should be verified." \
            --latest
