name: Publish PocketFoldLive v37 APK
on:
  push:
    paths:
      - '.github/workflows/publish-v37.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch independently signed v37 APK
        env:
          ARTIFACT_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-4724-820b-a5ee-50e18d61cf01/raw?se=2026-10-11T10%3A05%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=75568643-734e-59b0-839a-2723c675bec2&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T08%3A50%3A36Z&ske=2026-10-12T08%3A50%3A36Z&sks=b&skv=2026-02-06&sig=/W3rRhQXGy3/pehgjCUrEJiKkTnNoCo3VXiPXYvzvkM%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output signed.zip
          unzip -o signed.zip PocketFoldLive.apk
          test -s PocketFoldLive.apk
          echo '66adb91001c31d9cf9c4dea25ab8c40e92daa0a1b060f6dd3dc267601df85b3e  PocketFoldLive.apk' | sha256sum --check -
      - name: Publish v37 latest for app updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v37 PocketFoldLive.apk --repo "${{ github.repository }}" \
            --title "PocketFoldLive v0.17.2 (37)" \
            --notes "Scene-specific gallery: 32 wallpapers (16 new publisher-linked originals), prioritized for normal, charging, full, low battery, critical, night, morning, evening and unfolded screen. Mobile portrait and wide landscape variants are labeled; user-selected fold screen is preserved during video preview/application. Download buttons use verified original creator MP4 URLs on MotionBGS and MINUHOME without mirroring fan video files to GitHub. Signed APK from bf90dec864c285beca118d17411f50a3310b9058. Build and unit tests passed. Original hosting availability and device playback can vary." \
            --latest
