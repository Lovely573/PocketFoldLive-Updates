name: Publish signed build 69 once
on:
  push:
    paths: [".github/workflows/publish-v69-once.yml"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve verified source build APK
        env:
          ARTIFACT_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-060c-820b-8d98-0a1bb11313c1/raw?se=2026-10-13T01%3A02%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=50ce2adc-604b-5328-93f7-a41bd1368439&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T00%3A24%3A05Z&ske=2026-10-14T00%3A24%3A05Z&sks=b&skv=2026-02-06&sig=zOMc6Xf2qRrYU64qbJLt/uY76%2BW15QZT3dUT1i/0iA4%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error "$ARTIFACT_URL" -o signed.zip
          unzip -p signed.zip PocketFoldLive.apk > PocketFoldLive.apk
          echo "40beaef364383c0f42d92da0f78ea8add055fb97da48d8f0913908cc4db56d6a  PocketFoldLive.apk" | sha256sum -c -
          test "$(stat -c%s PocketFoldLive.apk)" -gt 10000000
      - name: Publish v69 signed in-app update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Lovely573/PocketFoldLive-Updates
        run: |
          cat > NOTES.md <<'EOF'
          ## PocketFoldLive v0.28.2 · Build 69

          ### Fixed: individual scene gallery always says '목록 로딩 실패'
          - The original bug was an all-or-nothing validation loop in the per-scene CharacterVideoExplorerActivity: two Chicswipe Shin-chan page-only originals have no direct MP4 URL, which correctly fails direct-media validation but should not fail the whole gallery.
          - These two entries are now recognized as **publisher-page-only, manual-import** choices rather than invalid playable MP4 files.
          - Each catalog item is validated individually, so one malformed or unsupported URL does not stop other verified video thumbnails and previews from loading. The gallery shows how many records it rejected.
          - Preserve strict HTTPS/host/path checks for direct downloads; a publisher-only reference cannot be misrepresented as an auto-playing video.
          - Cache the last correctly parsed catalog locally so a later intermittent network outage can use it without caching any third-party video bytes.
          - Regression unit tests cover the two Shin-chan page-only records, Tistory attachments, allowed direct MotionBGS originals, and forbidden external URLs.
          - Automatic scene recommendation, charging video catalog v14, user wallpaper choices, downloaded video files, likes/dislikes and wallpaper playback diagnostics are unchanged.

          Source: Lovely573/PocketFoldLive commit ce0c76dd1b74ffcb562bcc50e3fa430ff4847cc0.
          Main Android CI: unit tests, release APK build and signing succeeded.
          APK SHA256: 40beaef364383c0f42d92da0f78ea8add055fb97da48d8f0913908cc4db56d6a
          Fold8 live previews still require user device testing.
          EOF
          gh release create v69 PocketFoldLive.apk --title "PocketFoldLive v0.28.2 (69)" --notes-file NOTES.md --latest
