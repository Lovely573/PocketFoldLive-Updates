name: Publish PocketFoldLive v27 APK
on:
  push:
    paths:
      - '.github/workflows/publish-v27.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch signed APK from private CI artifact
        env:
          ARTIFACT_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-7794-8209-aa3d-99eb5d348da4/raw?se=2026-10-11T03%3A39%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=a6fe4fd0-38c0-5f39-8fd9-6a695126f276&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T23%3A22%3A46Z&ske=2026-10-11T23%3A22%3A46Z&sks=b&skv=2026-02-06&sig=0pb/xeRz8iYRH8oUfcvPohzbvJI1dmuAJW4ILpWu4g0%3D'
        run: |
          curl --retry 3 --fail --location "$ARTIFACT_URL" --output artifact.zip
          unzip -o artifact.zip PocketFoldLive.apk
          test -s PocketFoldLive.apk
      - name: Publish public signed APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v27 PocketFoldLive.apk --repo "${{ github.repository }}" --title "PocketFoldLive v0.12.0 (27)" --notes "Adaptive portrait/unfolded/landscape video profiles, optional scene transition videos, generic character selection and video source discovery. Source remains private." --latest
