name: Publish PocketFoldLive v85 signed APK
on:
  push:
    paths:
      - '.github/workflows/publish-v85.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and SHA-256 verify the release APK
        env:
          ARTIFACT_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-e1c0-820b-a90d-3103251e66cb/raw?se=2026-10-13T13%3A15%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=30913997-f98a-5863-83a0-7854c49febf7&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T12%3A23%3A59Z&ske=2026-10-14T12%3A23%3A59Z&sks=b&skv=2026-02-06&sig=1lpdZgeMsu3OPvph/wLSJip/DSiW8LjIDcinb51s6Zg%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output signed.zip
          unzip -t signed.zip
          unzip -o signed.zip PocketFoldLive-B85-test.apk
          mv PocketFoldLive-B85-test.apk PocketFoldLive.apk
          test -s PocketFoldLive.apk
          echo 'e7a2f4eb39002cbc1bd2d4841f148218562a98cd2b912c6785389bb8a175e832  PocketFoldLive.apk' | sha256sum --check -
      - name: Publish signed PocketFoldLive 0.34.0 v85
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'NOTES'
          ## PocketFoldLive 0.34.0 · 빌드 85

          ### 영상 찾기 UX
          - 영상 찾기에서 전체 추천, 좋아요 영상, 내 파일 가져오기, 현재 적용된 영상을 바로 선택할 수 있습니다.
          - 움직이는 추천 영상 영역에서 전체 영상/좋아요 영상을 바로 전환할 수 있으며, 좋아요 목록이 비어 있으면 전체 목록 복귀를 안내합니다.
          - 좋아요만 눌렀을 때 재생 중인 미리보기 전체를 다시 만들지 않도록 개선했습니다.
          - 접힘/펼침 화면에 저장된 영상, 사용하지 않는 상황의 영상, 대체 재생되는 영상을 구분해 표시합니다.
          - 상황별 설정 그룹은 제목으로 펼치거나 접을 수 있고, 상황 사용 중지 전 확인창을 표시합니다.
          - 기존 이중 스크롤의 부드러운 인계, 화면별 배경화면 재생, 네트워크 및 캐시 옵션은 유지합니다.

          ### 설치 및 검증
          - 기존 앱을 삭제하지 않고 업데이트 설치하세요. 지정 영상, 좋아요/싫어요 기록 및 설정은 보존됩니다.
          - Android 17 / Fold8에서 빌드 83 스크롤을 확인했으며, 빌드 85 UI 변경은 GitHub CI 단위 테스트와 서명 검증을 통과했습니다.
          - Fold8에서 좋아요 필터, 장면 변경, 미리보기 및 화면 전환을 최종 확인할 것을 권장합니다.

          Source main commit: b40895f1674f06e3fbc593a351bb98e19a8eef46
          Signed APK SHA256: e7a2f4eb39002cbc1bd2d4841f148218562a98cd2b912c6785389bb8a175e832
          NOTES
          gh release create v85 PocketFoldLive.apk --repo "${{ github.repository }}" \
            --title "PocketFoldLive 0.34.0 (빌드 85)" \
            --notes-file RELEASE_NOTES.md --latest
