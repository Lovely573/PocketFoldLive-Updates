name: Prepare wallpaper gallery demo
on:
  push:
    paths:
      - '.github/workflows/wallpaper-gallery-demo.yml'
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - name: Verify openly licensed sample and download
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 \
            'https://upload.wikimedia.org/wikipedia/commons/4/41/Ranger-Idle.gif' \
            --output ranger-idle-cc0.gif
          test "$(wc -c < ranger-idle-cc0.gif)" -gt 100000
          file ranger-idle-cc0.gif
      - name: Publish test wallpaper asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create wallpaper-pack-v1 ranger-idle-cc0.gif \
            --repo "${{ github.repository }}" \
            --title "Wallpaper Gallery Test Media (CC0)" \
            --notes "Prototype content to verify the in-app gallery. Source: Ranger-Idle.gif by Kurt Kaiser, Creative Commons CC0 1.0: https://commons.wikimedia.org/wiki/File:Ranger-Idle.gif . This is a low-resolution functional sample, not a final character recommendation." \
            --latest=false
