name: Verify original shared wallpaper attachment links
on:
  push:
    paths:
      - '.github/workflows/verify-original-links.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public posted download links (metadata only)
        run: |
          python3 - <<'PY'
          import re, html, urllib.request, urllib.parse
          from html.parser import HTMLParser
          pages=['https://minuhome.tistory.com/6790','https://minuhome.tistory.com/6193','https://minuhome.tistory.com/6797']
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.count=0; self.active=None; self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag!='a':return
                  d=dict(attrs);link=html.unescape(d.get('href',''))
                  if 'blog.kakaocdn.net' in link and '.mp4' in link:
                      self.active=link;self.count+=1;self.links.append(link)
                      path=urllib.parse.urlsplit(link).path
                      print('ATTACH',urllib.parse.unquote(path.split('/')[-1]),'querykeys',sorted(urllib.parse.parse_qs(urllib.parse.urlsplit(link).query)))
              def handle_data(self,data):
                  if self.active and '.mp4' in data:print('LABEL',data.strip()[:100])
              def handle_endtag(self,tag):
                  if tag=='a':self.active=None
          for url in pages:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as r: raw=r.read().decode('utf-8','replace')
              print('SOURCE',url,'bytes',len(raw))
              p=Links();p.feed(raw);print('MATCHED ANCHORS',p.count)
              import re
              anchors=re.findall(r'<a\\b[^>]*href="([^"]+)"[^>]*>(.*?)</a>',raw,re.S|re.I)
              if url.endswith('/6790'):
                  found=[html.unescape(h) for h,b in anchors if '피카츄.mp4' in b and 'blog.kakaocdn.net' in h]
                  if found:
                      check=urllib.request.Request(found[0],headers={'User-Agent':'Mozilla/5.0','Referer':url,'Range':'bytes=0-4095'})
                      with urllib.request.urlopen(check,timeout=40) as response:
                          header=response.headers.get('Content-Type','')
                          magic=response.read(1024)
                          print('FILE CHECK',response.status,'content-type',header,'magic',repr(magic[:20]),'length',response.headers.get('Content-Length'))
              print('CONTENT sample',repr(raw[max(0,raw.find('피카츄.mp4')-260):raw.find('피카츄.mp4')+200][:500]))
          PY
