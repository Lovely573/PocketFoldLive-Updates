name: Publish PocketFoldLive v61 signed APK
on:
  push:
    paths:
      - '.github/workflows/publish-v61.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified signed APK
        env:
          ARTIFACT_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-0584-820b-b493-2875e3e2b8ca/raw?se=2026-10-12T07%3A08%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=07811332-262a-5933-9ff5-ed0c5fe21fc6&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T22%3A50%3A29Z&ske=2026-10-12T22%3A50%3A29Z&sks=b&skv=2026-02-06&sig=T4jbT/Yh1X1gu5WA801Gv8LHC4ZNgRCm6gpmLm1tWFc%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o signed.zip
          unzip -o signed.zip PocketFoldLive.apk
          test -s PocketFoldLive.apk
          echo 'b6ed676eeca8cef66423b8508ba32250a746f7cc4642de73131d80d0e7d98868  PocketFoldLive.apk' | sha256sum --check -
      - name: Publish version 0.24.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'NOTES'
          ## PocketFoldLive 0.24.0 · 빌드 61

          - 포켓몬·산리오·도라에몽·짱구·코난·자두야 등 테마를 선택하여 접힘·펼침·가로 화면의 상황별 영상 추천 조합을 확인하고 한꺼번에 적용할 수 있습니다.
          - 테마에 적합한 검증된 영상이 부족한 상황은 다른 캐릭터로 몰래 바꾸지 않고 현재 배경화면을 보존합니다.
          - 갤러리의 ‘테마 골라 상황별 영상 일괄 적용’으로 진입할 수 있습니다.
          - ‘상황별 영상 적용 현황’에서 각 영상을 다른 상황에 복사할 수 있습니다. 원본 영상 파일을 중복으로 저장하지 않습니다.
          - 마지막 영상 설정 변경 직전의 배치를 보존하며, ‘이전 배경화면 배치로 되돌리기’를 지원합니다.
          - 저장 영상·미리보기 캐시 용량을 확인하고 사용 중이지 않은 영상과 미리보기 캐시를 선택적으로 정리할 수 있습니다.
          - 정리 시 현재 사용 중인 파일과 되돌리기 기록이 참조하는 영상 파일은 삭제하지 않습니다.
          - 기존 영상·좋아요·싫어요·ChatGPT 프로젝트 연결·상황별 재생 기능 유지.

          **원본 영상 현황:** 자동 추천 카탈로그에 현재 명탐정 코난·안녕 자두야 테마의 검증된 추천 항목이 없습니다. 두 테마는 선택은 가능하지만, 검증된 영상을 추가하기 전에는 일괄 설정이 불가능하다고 안내합니다. 도라에몽도 원본 영상 수가 적어 일부 상황은 그대로 유지될 수 있습니다.
          **되돌리기 범위:** 마지막 한 번의 영상 배치 변경만 복원합니다. 파일이 기기에서 이미 삭제됐다면 복원하지 않고 현재 설정을 유지합니다.
          **주의:** 삼성 배경화면에 실제 적용하는 작업은 커버/내부에서 별도 지정이 필요할 수 있습니다.

          Source commit: 6c951db88afa6f64e7c6c7f33da2c3214aba9dc1e
          APK SHA256: b6ed676eeca8cef66423b8508ba32250a746f7cc4642de73131d80d0e7d98868
          NOTES
          gh release create v61 PocketFoldLive.apk --repo "${{ github.repository }}" --title "PocketFoldLive v0.24.0 (61)" --notes-file RELEASE_NOTES.md --latest
