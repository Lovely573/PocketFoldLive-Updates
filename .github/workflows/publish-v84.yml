name: Publish PocketFoldLive v84 signed APK
on:
  push:
    paths:
      - '.github/workflows/publish-v84.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch verified signed APK and check SHA256
        env:
          ARTIFACT_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-9090-820b-8b87-7dca0546221c/raw?se=2026-10-13T09%3A03%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=7fdf9877-7fea-59cf-a56e-d3cae238ea79&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T01%3A30%3A29Z&ske=2026-10-14T01%3A30%3A29Z&sks=b&skv=2026-02-06&sig=7AJ1Q8VxLFDcO/9R9jkesOw4dsYXx7ekTAiETUQp85s%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o signed.zip
          unzip -t signed.zip
          unzip -o signed.zip PocketFoldLive-B84-test.apk
          mv PocketFoldLive-B84-test.apk PocketFoldLive.apk
          test -s PocketFoldLive.apk
          echo '05655e4577bf368ae58737dccbf40fb8420f73be0e0929f3d02c21e9f0dd195c  PocketFoldLive.apk' | sha256sum --check -
      - name: Publish latest signed APK v84 to in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'NOTES'
          ## PocketFoldLive 0.33.0-test · 빌드 84

          - 빌드 80: 접힘/펼침 중심 홈 화면과 평상시·배터리·충전 상황 설정 단순화.
          - 빌드 81: 추천 영상 2열 카드, 4개씩 이어지는 독립 스크롤, 화면에서 바로 무음 미리보기.
          - 빌드 82~83: 첫 화면 추천 카드 부족 및 내부/외부 스크롤 충돌 개선.
          - 빌드 84: 영상 변경 화면에 이전·홈·설정 바로가기.
          - Wi-Fi 연결 시에만 새로운 영상 자동 미리보기 다운로드(기본 ON). 모바일 데이터 허용 옵션 제공.
          - 미리보기 캐시 저장 공간 확인 및 정리 기능, 스크롤 중 디스크 갱신량 감소.
          - 현재 적용된 영상·캐릭터 후보·좋아요/싫어요·상황별 설정은 보존합니다.
          - Fold8 실기기에서 빌드 83의 주요 기능 및 스크롤 확인 완료. 빌드 84의 새 탐색 바로가기·설정은 자동 테스트 통과.

          Source main commit: 5759b25b55018afe197b312783b54fea47fd0683
          Signed APK SHA256: 05655e4577bf368ae58737dccbf40fb8420f73be0e0929f3d02c21e9f0dd195c
          NOTES
          gh release create v84 PocketFoldLive.apk --repo "${{ github.repository }}" \
            --title "PocketFoldLive 0.33.0 (빌드 84)" \
            --notes-file RELEASE_NOTES.md --latest
