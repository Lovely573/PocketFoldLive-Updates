name: Publish PocketFoldLive v49 APK
on:
  push:
    paths:
      - '.github/workflows/publish-v49.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch signed v49 APK and verify digest
        env:
          ARTIFACT_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-cb20-820b-98db-602c7e2a0523/raw?se=2026-10-12T02%3A12%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=c30a74b2-ca20-5e3d-bf45-1fdc49c70eb1&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T22%3A42%3A02Z&ske=2026-10-12T22%3A42%3A02Z&sks=b&skv=2026-02-06&sig=jmlvjjQ%2B1qRHYCfUtNgAkEDrW12E6msGfHPV7CvcGZg%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output signed.zip
          unzip -o signed.zip PocketFoldLive.apk
          test -s PocketFoldLive.apk
          echo '1d3fdf15c6909709fc00026f077301866d8d62f601c0aa0f9a28582ba84c3148  PocketFoldLive.apk' | sha256sum --check -
      - name: Release v49 for in-app update dialog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v49 PocketFoldLive.apk --repo "${{ github.repository }}" \
            --title "PocketFoldLive v0.20.0 (49)" \
            --notes "Real application implementation of taste-based recommendation onboarding. First automatic preset setup shows five short questions: favorite character/category (Pokemon, Shinchan, Sanrio, animals, backgrounds or mixed), mood (cute/calm/dark/energetic/mixed), drawing style (2D/3D/both), variety across scenes (uniform/varied/characters/backgrounds) and charging style (characters/electric/both). Responses are saved on device; subsequent setups reuse the previous taste, and Rechoose Preferences reopens the five questions. Scores reorder recommendations for all matching screens and contexts without relaxing strict scene/orientation requirements, while selections applied to wallpaper remain intact until explicit confirm. Individual video gallery also respects the stored taste. Remote original-linked catalog v9 adds six new portrait/landscape HD/FHD sources: blue charging circuit, dark night sky and light-up sky, giving 95 total candidate video variants and taste tags on the entire collection. User-compiled update stays in Github releases; sources retain original licenses, no clips rehosted. Source commit 58baf4a1dd602c420d03bf356cb26926cb52a92b. Signed SHA256 1d3fdf15c6909709fc00026f077301866d8d62f601c0aa0f9a28582ba84c3148. Android unit tests, release build, private signing and artifact upload passed. Actual Android Fold8 user flow/video playback needs device verification." \
            --latest
