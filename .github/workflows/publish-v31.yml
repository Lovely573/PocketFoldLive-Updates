name: Publish PocketFoldLive v31 APK
on:
  push:
    paths:
      - '.github/workflows/publish-v31.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve signed private-main v31 build
        env:
          ARTIFACT_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-3a1c-820b-bec5-8915ebc73382/raw?se=2026-10-11T07%3A04%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=b49feccf-69a1-5b6c-891c-a3a8f8604b2a&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T02%3A31%3A48Z&ske=2026-10-12T02%3A31%3A48Z&sks=b&skv=2026-02-06&sig=OCF9aY4GdUc29TcGlTF1BBOdejBjD0cjZQaUsTTgo7w%3D'
        run: |
          set -euo pipefail
          curl --retry 3 --fail --location "$ARTIFACT_URL" --output artifact.zip
          unzip -o artifact.zip PocketFoldLive.apk
          test -s PocketFoldLive.apk
      - name: Publish public APK-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v31 PocketFoldLive.apk --repo "${{ github.repository }}" --title "PocketFoldLive v0.14.1 (31)" --notes "Curated character animation suggestions (Shin-chan, Pikachu, Doraemon) and high-resolution Pixabay MP4 candidates by scene. Adds user-selected animated GIF/WebP motion preview and application, actual pixel-resolution quality labels and warnings, and independently configurable scene and screen slots. Official copyrighted clips are linked for viewing only, never bundled or scraped. The same private signing key as v29/v30 enables normal APK updates. Tested in GitHub Actions; actual Galaxy Fold8 runtime behavior requires device testing." --latest
