name: Publish PocketFoldLive v45 APK
on:
  push:
    paths:
      - '.github/workflows/publish-v45.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify release-signed v45 APK
        env:
          ARTIFACT_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-3088-8206-b9f6-57fb8b531fa0/raw?se=2026-10-12T00%3A32%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=31067cf5-1b8b-56b1-b5e3-8aa372842608&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T00%3A05%3A15Z&ske=2026-10-13T00%3A05%3A15Z&sks=b&skv=2026-02-06&sig=AvrZvP2SlaM3BHTEovl4LAj3vUPZohHLj2jAfbKtC1o%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output signed.zip
          unzip -o signed.zip PocketFoldLive.apk
          test -s PocketFoldLive.apk
          echo 'b142b12e3cca78473d4d6a312bfb95ac3b84dc0ce373f1ceceb7433f4b6225d3  PocketFoldLive.apk' | sha256sum --check -
      - name: Publish v45 for existing in-app update checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v45 PocketFoldLive.apk --repo "${{ github.repository }}" \
            --title "PocketFoldLive v0.19.1 (45)" \
            --notes "Expanded original creator-linked animated wallpaper catalog from 61 to 89 MP4 source variants, adding 28 verified publisher mobile HD portrait and separate wide 1920x1080 versions of Cinnamoroll, Kuromi, Garfield, Kirby, cats, corgi and Spirited Away scenes. Existing scene-specific 2D/3D and non-pixel curation is preserved; videos are downloaded from original publisher for local personal use and never redistributed in this release. Streamlined home screen by removing redundant scene descriptions and narrow two-column actions. Gallery and automatic preset use compact responsive padding and selector layouts on Fold cover, avoid horizontal overflow, and constrain long card titles to two lines. More-source links are collapsed until requested. Settings start with a read-only battery/night summary and hide rarely changed thresholds, visual effects and transitions in a clearly named expandable Advanced Settings area. Existing values and wallpaper assignments are retained. Android unit tests, release build and private signing passed from source ce88cd44c35593f820d208fd0042111cee705e78. SHA-256 b142b12e3cca78473d4d6a312bfb95ac3b84dc0ce373f1ceceb7433f4b6225d3. Test actual publisher playback and screen fit on device." \
            --latest
