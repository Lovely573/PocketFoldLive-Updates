name: Publish PocketFoldLive v42 APK
on:
  push:
    paths:
      - '.github/workflows/publish-v42.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download v42 release-signed APK and verify SHA256
        env:
          ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-40ec-81fd-a4cc-c3a3ba0767ca/raw?se=2026-10-11T13%3A12%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=f71ecc86-4bb3-5a11-9215-1647f443aa39&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T09%3A55%3A56Z&ske=2026-10-12T09%3A55%3A56Z&sks=b&skv=2026-02-06&sig=shO7Vq/vuIp4LDh4LT6cohzP5t9YKnNvGKIES%2BGB8uY%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output signed.zip
          unzip -o signed.zip PocketFoldLive.apk
          test -s PocketFoldLive.apk
          echo '9446c544b1d9e5fc71d9313810e0ec08422013bca8522947927a533f61e03a45  PocketFoldLive.apk' | sha256sum --check -
      - name: Release verified v42 for in-app updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v42 PocketFoldLive.apk --repo "${{ github.repository }}" \
            --title "PocketFoldLive v0.18.2 (42)" \
            --notes "Redesigned automatic wallpaper setup to display one scenario at a time rather than a long grid. Choose cover, unfolded or landscape display; browse each of 10 scenes using Previous/Next, rotate recommended clips within each scene, and see a looping in-page video preview (downloaded locally from the original publisher for personal use). Selections across all 30 scene/display slots are preserved and can be batch applied or applied individually. Preview caches are reused while in the screen; loading or unavailable originals show a clear status without replacing existing wallpaper. New automatic update check on app launch (only for newly available public releases), with update or defer choice; deferred releases do not keep prompting, and manual Settings check remains available. Source commit c7a4f41f87e65ebbbd2839b521d9eb492bc0d958, signed APK SHA-256 9446c544b1d9e5fc71d9313810e0ec08422013bca8522947927a533f61e03a45. Unit tests, release build and signing passed. Actual device preview/download compatibility should be confirmed." \
            --latest
