name: Publish signed PocketFoldLive v72 once
on:
  push:
    paths:
      - ".github/workflows/publish-v72-once.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'Lovely573/PocketFoldLive-Updates'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Ensure release v72 does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v72 --repo Lovely573/PocketFoldLive-Updates >/dev/null 2>&1; then
            echo "Refusing to republish existing v72"
            exit 1
          fi
      - name: Retrieve and validate signed build 72
        env:
          SOURCE_ARCHIVE_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-ff30-820b-a685-12a72ea33482/raw?se=2026-10-13T02%3A59%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=3f934c56-fd55-52b4-833a-a8aa8b287286&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T00%3A24%3A05Z&ske=2026-10-14T00%3A24%3A05Z&sks=b&skv=2026-02-06&sig=Go94OtowlfhJTgeT/lYkpW%2BYZpiev/gt0Asdc8GrPwc%3D"
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 180 "$SOURCE_ARCHIVE_URL" -o artifact.zip
          echo "32d13a6f18752017f16af16cf492b6d776269672b9ef1068617d5fd6ed9722ff  artifact.zip" | sha256sum -c -
          unzip -p artifact.zip PocketFoldLive-B72-test.apk > PocketFoldLive.apk
          echo "00713f79314827c4aa5f361162c199a033de53c1e1b0ec16ffb2874aaa5f850c  PocketFoldLive.apk" | sha256sum -c -
          test "$(stat -c '%s' PocketFoldLive.apk)" -eq 14713307
      - name: Publish official app-updater v72 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v72 PocketFoldLive.apk \
            --repo Lovely573/PocketFoldLive-Updates \
            --title "PocketFoldLive v0.30.1 (build 72)" \
            --notes "홈 화면과 영상 변경 화면의 남색·푸른색 스타일 및 버튼·설명 사이 여백을 통일했습니다. 영상 변경 화면에서 기존에 설정된 동영상/GIF/WebP가 자동 미리보기로 재생되고, 접힘·펼침이나 상황을 변경하면 해당 화면의 저장 영상 또는 기본 대체 영상을 표시합니다. 복잡한 상세 검색 필터는 접을 수 있도록 정리했습니다. 기존 영상·설정·추천 목록과 좋아요 기록은 유지됩니다. Fold8 실기기 환경에서 실제 동작 검증은 설치 후 확인이 필요합니다." \
            --latest
