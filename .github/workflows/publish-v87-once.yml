name: Publish PocketFoldLive v87 (one-time transfer)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v87-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v87-one-time
  cancel-in-progress: false

jobs:
  publish-v87:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download exact signed v87 APK from verified handoff
        env:
          TRANSFER_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-7768-81f5-9922-6a8d91a0fd77/raw?se=2026-10-19T13%3A22%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=b66a5d26-0b09-5523-b17f-d1bd203d708a&skoid=27fbae2c-124f-4566-a0d8-1b07a5a41c53&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-19T12%3A53%3A23Z&ske=2026-10-20T12%3A53%3A23Z&sks=b&skv=2026-02-06&sig=A6eN5jJmvvVk92rcI2ZTTdAcj2GDmG7tVlKbTegO4h4%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 150 \
            --output /tmp/PocketFoldLive-v87.zip "$TRANSFER_URL"
          mkdir -p /tmp/pfl-release
          unzip -j /tmp/PocketFoldLive-v87.zip PocketFoldLive.apk -d /tmp/pfl-release

      - name: Check APK checksum, signature, identity, and version
        run: |
          set -euo pipefail
          cd /tmp/pfl-release
          echo 'ce23052628519398c0d6e76469e328b93d11ae6b7f0cf97c34b37873cc90c845  PocketFoldLive.apk' | sha256sum --check
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(ls -d "$SDK_DIR"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs PocketFoldLive.apk
          META="$("$BUILD_TOOLS/aapt" dump badging PocketFoldLive.apk | sed -n '1p')"
          printf '%s\n' "$META"
          [[ "$META" == *"name='com.lovely573.pocketfoldlive'"* ]]
          [[ "$META" == *"versionCode='87'"* ]]
          [[ "$META" == *"versionName='0.36.0'"* ]]

      - name: Publish v87 as latest stable update (never overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v87 --repo Lovely573/PocketFoldLive-Updates >/dev/null 2>&1; then
            echo "Release v87 already exists; refusing overwrite."
            exit 1
          fi
          gh release create v87 /tmp/pfl-release/PocketFoldLive.apk \
            --repo Lovely573/PocketFoldLive-Updates \
            --title 'PocketFoldLive 0.36.0 (빌드 87)' \
            --notes '치이카와 세로·가로 라이브 배경 원본 모음 4개 연결. 기존 영상 선택 및 설정 유지. 검증된 정식 서명 APK.' \
            --latest

      - name: Confirm public release asset checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v87 --repo Lovely573/PocketFoldLive-Updates --json tagName,isLatest,assets | jq -e '.tagName == "v87" and .isLatest == true and (.assets | any(.name=="PocketFoldLive.apk"))'
