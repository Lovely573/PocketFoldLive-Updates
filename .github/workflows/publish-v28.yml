name: Publish PocketFoldLive v28 APK
on:
  push:
    paths:
      - '.github/workflows/publish-v28.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch signed APK from private build
        env:
          ARTIFACT_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-7868-8206-9568-65906a9593ba/raw?se=2026-10-11T03%3A49%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=65c1caa8-eadd-559a-96e6-d7814ed750af&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T00%3A42%3A03Z&ske=2026-10-12T00%3A42%3A03Z&sks=b&skv=2026-02-06&sig=qf1ZyU/WZvGteDKRSpqbA7TrqrUv1Ib%2Bx4pdptSSJOA%3D'
        run: |
          curl --retry 3 --fail --location "$ARTIFACT_URL" --output artifact.zip
          unzip -o artifact.zip PocketFoldLive.apk
          test -s PocketFoldLive.apk
      - name: Publish APK-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v28 PocketFoldLive.apk --repo "${{ github.repository }}" --title "PocketFoldLive v0.13.0 (28)" --notes "Mood-based video recommendations and automatic portrait/unfolded/landscape slot assignment from video metadata. Source remains private." --latest
