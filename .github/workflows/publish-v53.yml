name: Publish PocketFoldLive v53 APK
on:
  push:
    paths:
      - '.github/workflows/publish-v53.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch signed APK and validate SHA256
        env:
          ARTIFACT_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-a8a4-820b-95db-c2797c3dbc00/raw?se=2026-10-12T03%3A38%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=047bcbc1-4d41-5763-98c5-626f7c326b81&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T01%3A59%3A36Z&ske=2026-10-13T01%3A59%3A36Z&sks=b&skv=2026-02-06&sig=z5sWMHXt4qrL7vmeI5cKTMYToRTzBX3K1HAO//%2BDkHA%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output signed.zip
          unzip -o signed.zip PocketFoldLive.apk
          test -s PocketFoldLive.apk
          echo '5bb150cb6f8dcdc59067e934c91b65592ddc497d194aff3f50bc7c617876fe32  PocketFoldLive.apk' | sha256sum --check -
      - name: Publish v53 signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v53 PocketFoldLive.apk --repo "${{ github.repository }}" \
            --title "PocketFoldLive v0.20.4 (53)" \
            --notes "v53 / 0.20.4 - Personalize recommendations with liked/disliked artwork persisted on device (shared between portrait and landscape). Disliked works excluded from automated recommendations; liked works boosted and filterable. Both automatic preset and video explorer support reactions. Preview MP4s are cached across activity restarts with a 240 MB / 30-file pruning limit. 4-item comparison pages include all candidates without skipping the end of a cycle; new tests cover liked/disliked ranking and paging. Existing applied wallpaper assignments are not changed. GitHub Actions unit tests, release build, private-key signing and artifact upload succeeded. Requires on-device Fold8 validation. Source commit 74cefd9e7210748ec3ce5f6b7103b0737d307af8. APK SHA256 5bb150cb6f8dcdc59067e934c91b65592ddc497d194aff3f50bc7c617876fe32." \
            --latest
