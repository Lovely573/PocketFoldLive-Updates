name: Publish PocketFoldLive v48 APK
on:
  push:
    paths:
      - '.github/workflows/publish-v48.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed APK and verify its exact checksum
        env:
          ARTIFACT_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-c6d0-820b-b748-f5922e23dcef/raw?se=2026-10-12T01%3A19%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=cf363d37-2f18-5d72-a28c-2232370d1639&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T22%3A42%3A00Z&ske=2026-10-12T22%3A42%3A00Z&sks=b&skv=2026-02-06&sig=q/wl0gTEdEKXnCLSd7Dsj6GPEGHH23BuIqnPXkN93kc%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output signed.zip
          unzip -o signed.zip PocketFoldLive.apk
          test -s PocketFoldLive.apk
          echo '1c0f4aa54dae1f72784ddfbe351bd0be4a46c96ae2e5877d4d2814041df4713b  PocketFoldLive.apk' | sha256sum --check -
      - name: Release signed v48 for in-app updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v48 PocketFoldLive.apk --repo "${{ github.repository }}" \
            --title "PocketFoldLive v0.19.4 (48)" \
            --notes "Fix flashing when scrolling through individual live-video thumbnails in the full preset overview. Video MP4 downloads continue to be cached per setup session; each card now retains its still frame above the ExoPlayer surface until a fresh first video frame is rendered. Scrolling out restores the video thumbnail instead of revealing a black shutter; limit to two active decoders. Add a default combined Fold cover+inner preview choice (둘 다) showing both sets of scene cards together. Individual scene video choices remain independently customizable; one confirm button stores selected cover, inner and landscape videos in a single batch. Note that One UI may still require wallpaper activation separately on each physical screen. Update the publisher-linked curated catalog to v8 with three charging-start videos per orientation (Pikachu Loading, Lucario Energy and Arceus). Original video files are not redistributed through GitHub. Source commit 0340efa1b99434dd36fdae3e7c2d318ebb1b31f2, verified signed APK SHA-256 1c0f4aa54dae1f72784ddfbe351bd0be4a46c96ae2e5877d4d2814041df4713b. GitHub CI Android unit tests, release APK build and APK signing all passed. Verify actual Fold8 scroll behavior and wallpaper screens on device." \
            --latest
