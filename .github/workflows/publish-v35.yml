name: Publish PocketFoldLive v35 APK
on:
  push:
    paths:
      - '.github/workflows/publish-v35.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve verified and privately signed main-branch v35 APK
        env:
          ARTIFACT_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-b468-820b-aa23-a52b48fc032b/raw?se=2026-10-11T09%3A16%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=f6c813de-7bad-597f-86cb-49abd316daed&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T02%3A31%3A48Z&ske=2026-10-12T02%3A31%3A48Z&sks=b&skv=2026-02-06&sig=yxq%2BdOCGFeiFHWBWpRJ90ASeMcToRXVKWGUFzQWVcTA%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output artifact.zip
          unzip -o artifact.zip PocketFoldLive.apk
          test -s PocketFoldLive.apk
      - name: Publish v35 to public APK updates repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v35 PocketFoldLive.apk --repo "${{ github.repository }}" --title "PocketFoldLive v0.17.0 (35)" --notes "16 creator-shared live wallpapers directly previewable and applicable inside PocketFoldLive: 8 Shin-chan and 8 Pokémon (including Eevee, Pikachu, Mimikyu). Catalog v2 stores titles and original MINUHOME article links only, not copyrighted MP4 files. User tap resolves the current publisher-provided signed attachment URL by exact filename, downloads to device, checks MP4 signature, previews real motion and native pixel aspect ratio, and applies only to the selected scene/fold-display slot. Original source link is provided for each clip. Preserves modern dark UI and prior wallpaper selections. Version 35 signed with same private release key as earlier versions. Unit tests, Android build, signed APK verification passed; physical Fold8 streaming playback needs smoke testing." --latest
